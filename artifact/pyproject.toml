[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anonymous-gradient-audit-artifact"
version = "1.0.0"
description = "Anonymous experimental artifact for a matched target-reassignment audit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.11",
  "torch>=2.1",
]

[project.optional-dependencies]
vision = ["torchvision>=0.16", "Pillow>=10", "PyYAML>=6", "opencv-python-headless>=4.8", "quadprog>=0.1", "kornia>=0.7", "timm>=1.0", "tqdm>=4.66", "setproctitle>=1.3"]
transformer = ["transformers>=4.56", "huggingface-hub>=0.34", "pyarrow>=15", "safetensors>=0.4", "tokenizers>=0.19"]
test = ["pytest>=7", "matplotlib>=3.8"]
all = ["torchvision>=0.16", "Pillow>=10", "PyYAML>=6", "opencv-python-headless>=4.8", "quadprog>=0.1", "kornia>=0.7", "timm>=1.0", "tqdm>=4.66", "setproctitle>=1.3", "transformers>=4.56", "huggingface-hub>=0.34", "pyarrow>=15", "safetensors>=0.4", "tokenizers>=0.19", "pytest>=7", "matplotlib>=3.8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = [".", "src"]
